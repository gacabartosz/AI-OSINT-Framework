# AI-OSINT-Framework Configuration
# Copy this file to config.yml and fill in your values
# NEVER commit config.yml with real API keys!

# API Keys (use environment variables for production)
api_keys:
  claude: ${CLAUDE_API_KEY}
  openai: ${OPENAI_API_KEY}
  perplexity: ${PERPLEXITY_API_KEY}

  # News and data sources
  newsapi: ${NEWSAPI_KEY}

  # Social media (if using official APIs)
  twitter: ${TWITTER_API_KEY}
  github: ${GITHUB_TOKEN}

# Security settings
security:
  # Enable encryption for cached data
  encryption_enabled: true

  # Enable audit logging
  audit_logging: true

  # Data retention in days
  data_retention_days: 30

  # Enable rate limiting
  rate_limiting: true

  # Rate limits
  requests_per_minute: 100
  requests_per_hour: 1000

# Compliance settings
compliance:
  # Enable GDPR compliance mode
  gdpr_mode: true

  # Enable CCPA compliance mode
  ccpa_mode: true

  # Automatically anonymize PII
  anonymize_pii: true

  # Validate all sources for legality
  validate_sources: true

# Module settings
modules:
  # WHOIS module
  whois:
    enabled: true
    timeout: 10
    cache_ttl: 3600  # 1 hour

  # DNS module
  dns:
    enabled: true
    timeout: 5
    cache_ttl: 3600

  # Social media modules
  social_media:
    enabled: true
    # Only use official APIs
    use_official_apis_only: true

# AI provider settings
ai_providers:
  # Default provider
  default: claude

  # Claude settings
  claude:
    model: claude-3-5-sonnet-20241022
    max_tokens: 4096
    temperature: 0.7

  # OpenAI settings
  openai:
    model: gpt-4-turbo-preview
    max_tokens: 4096
    temperature: 0.7

  # Perplexity settings
  perplexity:
    model: pplx-70b-online
    max_tokens: 4096

# Caching settings
cache:
  # Enable caching
  enabled: true

  # Cache backend (memory, redis)
  backend: memory

  # Default TTL in seconds
  default_ttl: 3600

  # Redis settings (if using Redis backend)
  redis:
    host: localhost
    port: 6379
    db: 0
    password: null

# Logging settings
logging:
  # Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  level: INFO

  # Log format
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # Redact PII from logs
  redact_pii: true

  # Log file path (null for console only)
  file: null

  # Rotate logs
  rotate: true
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Network settings
network:
  # Connection timeout in seconds
  timeout: 30

  # Retry attempts
  max_retries: 3

  # Retry backoff
  retry_backoff: 2

  # Use proxy (null or proxy URL)
  proxy: null

  # Verify SSL certificates
  verify_ssl: true

# Output settings
output:
  # Default output format (json, yaml, csv, markdown)
  default_format: json

  # Pretty print JSON
  pretty_json: true

  # Include raw data in results
  include_raw: false

# Feature flags
features:
  # Enable experimental features
  experimental: false

  # Enable AI analysis by default
  default_ai_analysis: false

  # Enable multi-threading
  multi_threading: true
  max_workers: 4
